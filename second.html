<!DOCTYPE html>
<html lang="en">
<style>
    body {
        max-width: 600px; /*页面宽度限制，不要太宽*/
        margin: 60px auto; /*自动左右居中*/
        padding: 0 25px; /*左右留点边距，不贴屏幕边缘*/
    }
    body {
        background-color: #fff8f0;
    }
    h1,h2 {
        color: #e65100;
        text-align: center; /*标题居中*/
    }
    input,select,textarea {
        width: 100%; /*宽度铺满页面*/
        padding: 14px; /*内部留白，不挤*/
        border: 1px solid #ffccaa; /*浅橘边框*/
        border-radius: 12px; /*圆角！变好看的关键*/
        margin-bottom: 18px; /*每个框下面留距离，不挤一起*/
    }
    button {
        width:100%;
        padding:15px;
        background:#ff7043; /*美食橙色*/
        color:white; /*文字白色*/
        border:none; /*去掉默认灰色边框*/
        border-radius:12px; /*圆角*/
    }
    /*鼠标放上去按钮变色*/
    button:hover {
        background:#e64a19;
    }
    body {
        font-family: "Microsoft YaHei", sans-serif;
    }
</style>
<head>
    <meta charset="UTF-8">
    <title>Choose</title>
</head>

<body>
<h2 id="todayDate"></h2>
<p>啥时候去吃嘞?：</p>
<input type="date">
<p>想吃啥?：</p>
<select>
    <option>火锅</option>
    <option>烤肉</option>
    <option>小炒</option>
    <option>西餐漂亮饭</option>
    <option>小吃</option>
    <option>海鲜</option>
    <option>烧烤</option>
    <option>其他</option>
</select>
<p>如果是其他，请填写：</p>
<input type="text" placeholder="输入你想吃的其他食物“>

<input type="text" placeholder="选择食物类型哈:">
<br>
<br>
<br>
<br>
<button onClick="location.href='third.html'">来都来了，去第三页吧~ →</button>

<button onClick="location.href='forth.html'">← 你要回首页吗👀~</button>
<script>
    const today = new Date();
    const y = today.getFullYear();
    const m = String(today.getMonth() + 1).padStart(2, '0');
    const d = String(today.getDate()).padStart(2, '0');
    document.getElementById("todayDate").innerText = "今天日期：" + y + "-" + m + "-" + d;

</script>
</body>
</html>
