<!doctype html>
<html class="no-js" lang="">
<style>
  body {
    max-width: 600px; /*页面宽度限制，不要太宽*/
    margin: 60px auto; /*自动左右居中*/
    padding: 0 25px; /*左右留点边距，不贴屏幕边缘*/
  }
  body {
    background-color: #fff8f0;
  }
  h1,h2 {
    color: #e65100;
    text-align: center; /*标题居中*/
  }
  input,select,textarea {
    width: 100%; /*宽度铺满页面*/
    padding: 14px; /*内部留白，不挤*/
    border: 1px solid #ffccaa; /*浅橘边框*/
    border-radius: 12px; /*圆角！变好看的关键*/
    margin-bottom: 18px; /*每个框下面留距离，不挤一起*/
  }
  button {
    width:100%;
    padding:15px;
    background:#ff7043; /*美食橙色*/
    color:white; /*文字白色*/
    border:none; /*去掉默认灰色边框*/
    border-radius:12px; /*圆角*/
  }
  /*鼠标放上去按钮变色*/
  button:hover {
    background:#e64a19;
  }
  body {
    font-family: "Microsoft YaHei", sans-serif;
  }
</style>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>
