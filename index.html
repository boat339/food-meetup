<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="美食搭子：一起选择约饭日期、美食和餐厅。"
    />
    <title>欢迎 · 美食搭子 Foodie Meetup</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/app.js" defer></script>
  </head>
  <body data-page="home">
    <header>
      <a class="brand" href="index.html">🍊 美食搭子</a
      ><span>Foodie Meetup</span>
    </header>
    <main>
      <h1>一起发现好吃的！🎉</h1>
      <p>从一个名字开始，计划下一顿美食。</p>
      <form id="welcome-form">
        <label for="username">你的昵称</label>
        <input
          id="username"
          name="username"
          required
          maxlength="40"
          autocomplete="nickname"
          placeholder="怎么称呼你？"
        />
        <button type="submit">开始约饭 →</button>
      </form>
    </main>
    <footer>美食搭子 · 一起把下一顿安排好</footer>
  </body>
</html>
