<!DOCTYPE html>
<html lang="en">
<style>
  body {
    max-width: 600px; /*页面宽度限制，不要太宽*/
    margin: 60px auto; /*自动左右居中*/
    padding: 0 25px; /*左右留点边距，不贴屏幕边缘*/
  }
  body {
    background-color: #fff8f0;
  }
  h1,h2 {
    color: #e65100;
    text-align: center; /*标题居中*/
  }
  input,select,textarea {
    width: 100%; /*宽度铺满页面*/
    padding: 14px; /*内部留白，不挤*/
    border: 1px solid #ffccaa; /*浅橘边框*/
    border-radius: 12px; /*圆角！变好看的关键*/
    margin-bottom: 18px; /*每个框下面留距离，不挤一起*/
  }
  button {
    width:100%;
    padding:15px;
    background:#ff7043; /*美食橙色*/
    color:white; /*文字白色*/
    border:none; /*去掉默认灰色边框*/
    border-radius:12px; /*圆角*/
  }
  /*鼠标放上去按钮变色*/
  button:hover {
    background:#e64a19;
  }
  body {
    font-family: "Microsoft YaHei", sans-serif;
  }
</style>
<head>
    <meta charset="UTF-8">
    <title>surprise</title>
</head>
<body>
<h1>嘿！被骗了，啊哈哈哈哈！😉🤞</h1>
<p>别忘了告诉我哦，神秘小礼物哦~~</p>
<button onclick="location.href='index.html'">算啦，点我回去</button>

</body>
</html>
